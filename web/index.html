<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#264e45"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css">
  <title>远程交接</title><script src="/navigation.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar"><a class="brand" href="/"><img src="/icons/icon.svg" alt="" width="36" height="36"><span>远程交接</span></a><span id="connection" role="status">正在连接</span></header>
    <main>
      <section id="login" hidden class="panel login">
        <p class="eyebrow">自己的会话，随时接手</p><h1>从手机继续回答</h1><p>输入固定登录码，或在已登录电脑的「设备与通知」中查看登录码。</p>
        <form id="login-form"><label for="login-code">登录码</label><input id="login-code" name="token" type="password" autocomplete="current-password" required maxlength="200" placeholder="输入固定登录码"><button type="submit" class="primary">登录</button></form>
        <p class="muted">登录码长期有效，可重复使用；更新和重启服务后保持不变。</p>
      </section>
      <section id="workspace" hidden>
        <div class="intro"><div><p class="eyebrow">Grill / 反馈 / 求助</p><h1>待你处理</h1><p id="count">正在读取请求</p></div><div class="tools"><button id="refresh">刷新</button><button id="settings-toggle" aria-expanded="false" aria-controls="settings">设备与通知</button></div></div>
        <section id="settings" class="panel" hidden>
          <h2>设备与通知</h2><p>添加到手机主屏幕后，打开应用并点击「开启通知」。iPhone 需要 iOS 16.4 或以上版本。</p>
          <div class="tools"><button id="install">添加到桌面</button><button id="push">开启通知</button><button id="pair">查看登录码</button><button id="logout">退出此设备</button></div>
          <p id="device-state" role="status"></p><p id="pairing" hidden></p>
          <details><summary>安装方法</summary><p>iPhone：用 Safari 打开本站，点击分享，再选「添加到主屏幕」。Android：在浏览器菜单选择「安装应用」或「添加到主屏幕」。安装后重新打开应用并授权通知。</p></details>
        </section>
        <div class="filters"><label>类型<select id="kind"><option value="all">全部类型</option><option value="questionnaire">问卷</option><option value="feedback">反馈</option><option value="help">求助</option></select></label><label>状态<select id="status"><option value="open">待处理</option><option value="all">全部状态</option><option value="completed">已结束</option></select></label><label class="search">查找<input id="search" type="search" placeholder="标题、项目或来源会话"></label></div>
        <div id="requests" aria-live="polite"></div>
      </section>
      <p id="message" role="status"></p>
    </main>
    <footer><span>答复归还到对应的来源会话</span><span id="version"></span></footer>
  </div>
</body>
</html>
