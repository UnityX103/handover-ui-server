<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#264e45"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css">
  <title>远程交接</title><script src="/navigation.js" defer></script><script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar" aria-label="交接操作"><span id="connection" role="status">正在连接</span><span id="username-status" class="sr-only" role="status"></span><div class="tools"><button id="settings-toggle" hidden aria-expanded="false" aria-controls="settings">通知</button><button id="username-logout" type="button" hidden>退出</button></div></header>
    <main>
      <section id="username-panel" class="panel" aria-label="公开用户名交接"><h2>按用户名处理交接</h2><p>用户名只用于分类，不是身份认证。任何知道用户名的人都可能读取或操作其交接内容。</p><form id="username-form"><label for="username">目标用户名</label><input id="username" maxlength="64" pattern="[A-Za-z0-9_-]{1,64}" required autocomplete="off"><button type="submit">登录用户名</button> <a id="username-cancel" href="/">取消并返回首页</a></form></section>
      <section id="workspace" hidden>
        <h1 class="sr-only">交接请求</h1><p id="count" class="sr-only">正在读取请求</p><button id="refresh" class="sr-only sr-only-focusable" type="button" aria-label="刷新请求列表">刷新请求列表</button>
        <section id="settings" class="panel" hidden>
          <h2>设备与通知</h2><p>添加到手机主屏幕后，打开应用并点击「开启通知」。iPhone 需要 iOS 16.4 或以上版本。</p>
          <div class="tools"><button id="install">添加到桌面</button><button id="push">开启通知</button><button id="clear-unread" type="button">清空未读</button></div>
          <p id="device-state" role="status"></p>
          <details><summary>安装方法</summary><p>iPhone：用 Safari 打开本站，点击分享，再选「添加到主屏幕」。Android：在浏览器菜单选择「安装应用」或「添加到主屏幕」。安装后重新打开应用并授权通知。</p></details>
        </section>
        <div class="filters"><label>类型<select id="kind"><option value="all">全部类型</option><option value="questionnaire">问卷</option><option value="feedback">反馈</option><option value="help">求助</option></select></label><label>状态<select id="status"><option value="waiting" selected>待回答</option><option value="sent">已发送，等待回复</option><option value="all">全部状态</option><option value="open">进行中</option><option value="completed">已结束</option></select></label><label class="search">查找<input id="search" type="search" placeholder="标题、项目或来源会话"></label></div>
        <div id="requests" aria-live="polite"></div>
      </section>
      <p id="message" role="status"></p>
    </main>
    <footer><span>答复归还到对应的来源会话</span><span id="version"></span></footer>
  </div>
</body>
</html>
