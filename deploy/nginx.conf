# The public hostname/port and certificate must match HANDOVER_PUBLIC_URL.
server {
    listen 8024 ssl;
    listen [::]:8024 ssl;
    server_name server.nanzhaigame.cn;
    ssl_certificate /etc/letsencrypt/live/server.nanzhaigame.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.nanzhaigame.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    access_log /var/log/nginx/handover-ui.access.log;
    error_log /var/log/nginx/handover-ui.error.log;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location = /hooks/github {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8032;
        proxy_set_header Host $http_host;
        proxy_read_timeout 15s;
    }
    location / {
        proxy_pass http://127.0.0.1:8025;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        proxy_buffering off;
    }
}
