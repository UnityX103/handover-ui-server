# Include inside the existing HTTPS 443 server block. Keep the URI prefix:
# HANDOVER_PUBLIC_URL or HANDOVER_PUBLIC_ALIASES must include this full mount.
location = /handover {
    return 308 /handover/$is_args$args;
}
location = /handover/hooks/github {
    client_max_body_size 1m;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:8032/hooks/github;
    proxy_set_header Host $http_host;
    proxy_read_timeout 15s;
}
location ^~ /handover/ {
    client_max_body_size 8m;
    proxy_pass http://127.0.0.1:8025;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 45s;
    proxy_send_timeout 45s;
    proxy_buffering off;
    proxy_cache off;
}
